name: Daily market digest

on:
  schedule:
    # UTC 日〜木の22:00 = JST 月〜金の07:00 (土日のJSTは実行しない)
    # ※曜日はUTC基準: 0=日 1=月 ... 6=土。数分〜十数分遅れることがあります
    - cron: "0 22 * * 1-5"   # JST 火〜土の07:00
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write           # 結果のmdをコミットするために必要

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
 
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
 
      - name: Install dependencies
        run: uv sync --locked   # Pythonのバージョンも pyproject.toml / .python-version から解決される
 
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          OUTPUT_DIR: web/src/digests
        run: uv run news-summary-bot
 
      - name: Commit digest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push
