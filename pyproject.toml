[project]
name = "news-summary-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.31",
    "tavily-python>=0.8.5",
]

[project.scripts]
news-summary-bot = "news_summary_bot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
